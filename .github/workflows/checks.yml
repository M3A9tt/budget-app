name: Budget checks
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - name: Install browser for UI checks
        if: runner.os == 'Linux'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Check entry layout, pickers and complete financial flow
        if: runner.os == 'Linux'
        run: npm run test:layout
        env:
          LAYOUT_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/entry-layout
      - name: Check current bot screenshots
        if: runner.os == 'Linux'
        run: npm run test:bot-cards
        env:
          BOT_CARD_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/bot-cards
      - name: Check financial UI in Chromium
        if: runner.os == 'Linux'
        run: npm run test:browser
        env:
          BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa
      - name: Check reliability scenarios in Chromium
        if: runner.os == 'Linux'
        run: npm run test:reliability
      - name: Check recorded payments and emoji categories
        if: runner.os == 'Linux'
        run: npm run test:usability
        env:
          USABILITY_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/usability
      - name: Check payment actions, reconciliation and filters
        if: runner.os == 'Linux'
        run: npm run test:payments
        env:
          PAYMENT_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/payment-experience
      - name: Check on-demand payment lifecycle
        if: runner.os == 'Linux'
        run: npm run test:ondemand
        env:
          ONDEMAND_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/on-demand
      - name: Check connected calendar and shared financial sources
        if: runner.os == 'Linux'
        run: npm run test:calendar
        env:
          CALENDAR_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/connected-calendar
      - name: Check unified expense and income entry
        if: runner.os == 'Linux'
        run: npm run test:entry
        env:
          ENTRY_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/unified-entry
      - name: Check personal interface and reversible pilot
        if: runner.os == 'Linux'
        run: npm run test:personal
        env:
          PERSONAL_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa/personal
      - name: Save UI screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: financial-ui-screenshots
          path: ${{ runner.temp }}/burget-browser-qa
          if-no-files-found: ignore
