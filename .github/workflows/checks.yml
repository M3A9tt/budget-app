name: Budget checks
on:
  pull_request:
  push:
    branches: ["main", "codex/**"]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - name: Install browser for UI checks
        if: runner.os == 'Linux'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Check financial UI in Chromium
        if: runner.os == 'Linux'
        run: npm run test:browser
        env:
          BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/burget-browser-qa
      - name: Save UI screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: financial-ui-screenshots
          path: ${{ runner.temp }}/burget-browser-qa
          if-no-files-found: ignore
